<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <title>Daymark — thoughtful task planning</title>
  <style>
    :root{color-scheme:light;--ink:#202621;--muted:#788079;--line:#e6e7df;--paper:#fff;--canvas:#f5f4ef;--green:#315c46;--green-soft:#eaf1eb;--orange:#ef9e64;--shadow:0 20px 60px #24362b0c}
    *{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #94bba0;outline-offset:2px}
    .shell{max-width:1120px;margin:auto;padding:30px 34px 56px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:56px}.brand{display:flex;align-items:center;gap:11px;font-weight:750;letter-spacing:-.03em}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--green);color:#fff;font-size:19px}.top-note{color:var(--muted);font-size:13px}.hero{display:flex;align-items:end;justify-content:space-between;margin-bottom:29px}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:11px;font-weight:750;color:var(--green)}h1{font-size:clamp(33px,5vw,48px);letter-spacing:-.055em;line-height:1.1;margin:10px 0 8px}.subtitle{color:var(--muted);margin:0}.date-chip{color:var(--muted);font-size:13px;padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:#ffffff9c}
    .layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.85fr);gap:22px;align-items:start}.panel{background:var(--paper);border:1px solid #e9e9e3;border-radius:20px;box-shadow:var(--shadow)}.tasks-panel{padding:24px}.panel-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.panel-heading h2,.assistant-head h2{font-size:18px;letter-spacing:-.025em;margin:0}.count{font-size:12px;color:var(--muted)}.add-form{display:grid;grid-template-columns:1fr auto;gap:9px;margin-bottom:18px}.add-form input{min-width:0}.field{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 13px;color:var(--ink)}.field::placeholder{color:#a2a79f}.primary{border:0;border-radius:11px;padding:11px 16px;background:var(--green);color:white;font-weight:650}.primary:hover{background:#274c39}.task-list{display:grid;gap:9px}.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;border:1px solid var(--line);border-radius:13px;padding:14px}.task.done{opacity:.56}.task.done .task-title{text-decoration:line-through}.check{width:19px;height:19px;accent-color:var(--green);margin:2px 0 0}.task-title{font-weight:650}.task-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;color:var(--muted);font-size:12px}.badge{border-radius:999px;background:#f3f3ee;padding:2px 8px;text-transform:capitalize}.badge.high{background:#fff0e8;color:#a84e25}.badge.medium{background:#eff2e7;color:#69783e}.badge.low{background:#eef2f2;color:#617275}.actions{display:flex;gap:4px}.icon-btn{border:0;background:transparent;color:var(--muted);padding:4px 7px;border-radius:8px}.icon-btn:hover{background:var(--canvas);color:var(--ink)}.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:13px}
    .assistant{padding:22px;position:sticky;top:22px}.assistant-top{display:flex;gap:12px;align-items:center;margin-bottom:10px}.spark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:#fff0e5;color:#b86435;font-size:18px}.assistant-head p{margin:2px 0 0;color:var(--muted);font-size:12px}.assistant-copy{color:#737c74;font-size:13px;margin:15px 0}.assistant-input{width:100%;min-height:112px;resize:vertical}.assistant-actions{display:flex;gap:8px;margin-top:10px}.assistant-actions button{flex:1;padding:9px 8px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:12px;font-weight:650}.assistant-actions button:hover{border-color:#b7c9bb;background:#f8faf7}.send-row{display:flex;justify-content:flex-end;margin-top:9px}.response{display:none;margin-top:15px;padding:13px;border-radius:12px;background:var(--green-soft);color:#365b45;font-size:13px;white-space:pre-wrap}.response.show{display:block}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#202621;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
    @media(max-width:760px){.shell{padding:22px 17px 38px}.topbar{margin-bottom:40px}.layout{grid-template-columns:1fr}.assistant{position:static;grid-row:1}.hero{align-items:start;gap:12px;flex-direction:column}.date-chip{display:none}.tasks-panel{padding:18px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="brand"><span class="brand-mark">✓</span> daymark</div><div class="top-note">A little more focus, every day.</div></header>
    <section class="hero"><div><div class="eyebrow">Your personal workspace</div><h1>Make room for<br>what matters.</h1><p class="subtitle">A clear plan makes a calmer day.</p></div><div class="date-chip" id="today"></div></section>
    <section class="layout">
      <section class="panel tasks-panel" aria-labelledby="tasks-title"><div class="panel-heading"><h2 id="tasks-title">Your tasks</h2><span class="count" id="task-count">Loading…</span></div>
        <form class="add-form" id="add-form"><input class="field" id="new-title" placeholder="Add a task to your list…" maxlength="300" required aria-label="New task title"><button class="primary">Add task</button></form>
        <div class="task-list" id="task-list" aria-live="polite"></div>
      </section>
      <aside class="panel assistant" aria-labelledby="assistant-title"><div class="assistant-top"><div class="spark">✳</div><div class="assistant-head"><h2 id="assistant-title">Your assistant</h2><p>Here to help you think it through</p></div></div><p class="assistant-copy">Tell me what’s on your mind. Try “add buy milk tomorrow, high priority.”</p>
        <form id="assistant-form"><textarea class="field assistant-input" id="assistant-prompt" placeholder="What would you like to get done?" aria-label="Assistant request"></textarea><div class="assistant-actions"><button type="button" id="suggest-button">↗ &nbsp;Suggest next</button><button type="button" id="summary-button">☼ &nbsp;Daily summary</button></div><div class="send-row"><button class="primary" type="submit">Ask assistant &nbsp;→</button></div></form><div class="response" id="assistant-response" role="status"></div>
      </aside>
    </section>
  </main><div class="toast" id="toast" role="status"></div>
  <script>
    const list = document.querySelector('#task-list');
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const today = new Date();
    document.querySelector('#today').textContent = today.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
    async function request(url, options={}) {
      const response = await fetch(url,{headers:{'Content-Type':'application/json'},...options});
      if (!response.ok) { const error = await response.json().catch(()=>({})); throw new Error(error.detail || 'Request failed'); }
      return response.status === 204 ? null : response.json();
    }
    function toast(message) { const el=document.querySelector('#toast'); el.textContent=message; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2200); }
    async function refreshTasks() {
      const tasks = await request('/api/tasks');
      document.querySelector('#task-count').textContent = `${tasks.filter(task=>!task.completed).length} to do · ${tasks.length} total`;
      if (!tasks.length) { list.innerHTML='<div class="empty">Nothing here yet. Add your first task above.</div>'; return; }
      list.innerHTML = tasks.map(task => `<article class="task ${task.completed?'done':''}" data-id="${escapeHtml(task.id)}"><input class="check" type="checkbox" ${task.completed?'checked':''} aria-label="Complete ${escapeHtml(task.title)}"><div><div class="task-title">${escapeHtml(task.title)}</div><div class="task-meta">${task.details?`<span>${escapeHtml(task.details)}</span>`:''}${task.due_date?`<span>Due ${escapeHtml(task.due_date)}</span>`:''}<span class="badge ${escapeHtml(task.priority)}">${escapeHtml(task.priority)}</span></div></div><div class="actions"><button class="icon-btn edit" aria-label="Edit task">Edit</button><button class="icon-btn delete" aria-label="Delete task">×</button></div></article>`).join('');
    }
    document.querySelector('#add-form').addEventListener('submit',async event=>{event.preventDefault();const input=document.querySelector('#new-title');try{await request('/api/tasks',{method:'POST',body:JSON.stringify({title:input.value})});input.value='';await refreshTasks();toast('Task added');}catch(error){toast(error.message);}});
    list.addEventListener('click',async event=>{const card=event.target.closest('.task');if(!card)return;const id=card.dataset.id;try{if(event.target.closest('.delete')){await request(`/api/tasks/${id}`,{method:'DELETE'});await refreshTasks();toast('Task deleted');}else if(event.target.closest('.edit')){const current=card.querySelector('.task-title').textContent;const title=window.prompt('Update task',current);if(title?.trim()){await request(`/api/tasks/${id}`,{method:'PATCH',body:JSON.stringify({title:title.trim()})});await refreshTasks();toast('Task updated');}}}catch(error){toast(error.message);}});
    list.addEventListener('change',async event=>{if(!event.target.matches('.check'))return;const card=event.target.closest('.task');try{await request(`/api/tasks/${card.dataset.id}/complete`,{method:'POST'});await refreshTasks();}catch(error){toast(error.message);}});
    async function assistantAction(url, body) { const output=document.querySelector('#assistant-response');output.textContent='Thinking…';output.classList.add('show');try{const data=await request(url,{method:'POST',body:JSON.stringify(body)});output.textContent=data.response || data.message || 'Done.';if(data.task_changed)await refreshTasks();}catch(error){output.textContent=error.message;}}
    document.querySelector('#assistant-form').addEventListener('submit',event=>{event.preventDefault();const input=document.querySelector('#assistant-prompt');if(!input.value.trim())return;assistantAction('/api/assistant',{message:input.value.trim()});input.value='';});
    document.querySelector('#suggest-button').addEventListener('click',()=>assistantAction('/api/assistant/suggest',{}));
    document.querySelector('#summary-button').addEventListener('click',()=>assistantAction('/api/assistant/summary',{}));
    refreshTasks().catch(error=>{list.innerHTML=`<div class="empty">Could not load tasks: ${escapeHtml(error.message)}</div>`;});
  </script>
</body>
</html>
